<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Gravity Watch Party</title>
    <script src="https://cdn.gravity.place/fe/sdk/index-1.0.2.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="lobbyScreen" class="screen active">
        <div class="lobby-hero">
          <p class="eyebrow">Gravity Watch</p>
          <h1>Watch Party</h1>
          <p>Gravityの友だちとYouTubeを同時視聴</p>
        </div>

        <section class="profile-card lobby-profile">
          <div class="gravity-profile">
            <img id="profileAvatar" alt="" />
            <div>
              <span class="profile-label">表示名</span>
              <strong id="displayName" class="profile-name"></strong>
              <span id="gravityStatus">Gravity情報を確認中</span>
            </div>
          </div>
        </section>

        <section class="lobby-card">
          <h2>ルームを作成</h2>
          <button id="createPrivateRoom" class="primary-action create-room-button" type="button">ルームを作る</button>
        </section>

        <section class="lobby-card">
          <h2>ルームIDで参加</h2>
          <div class="join-row">
            <input id="joinRoomId" inputmode="numeric" placeholder="ルームID" autocomplete="off" />
            <button id="joinRoomButton" type="button">参加</button>
          </div>
        </section>

        <p class="lobby-note">作成後に表示されるルームIDをGravityで共有してください。</p>
      </section>

      <section id="roomScreen" class="screen room-screen">
        <header class="room-header">
          <div class="room-meta">
            <span id="hostBadge" class="host-badge">HOST</span>
            <span>Room <strong id="currentRoomId">----</strong></span>
          </div>
          <div class="room-actions">
            <span id="connectionStatus" class="status-dot">接続中</span>
            <button id="shareRoom" class="icon-button" type="button" title="ルーム招待">↗</button>
          </div>
        </header>

        <section class="stage">
          <div class="video-shell">
            <div id="emptyState" class="empty-state">
              <img id="poster" alt="" src="https://img.youtube.com/vi/jNQXAC9IVRw/maxresdefault.jpg" />
              <div class="empty-copy">
                <span>ルーム準備完了</span>
                <strong>YouTube URLを追加して開始</strong>
              </div>
            </div>
            <div id="player"></div>
            <div id="guestCover" class="guest-cover"></div>
          </div>

          <div class="status-bar">
            <span id="statusText">動画を追加してください</span>
            <div class="status-actions host-actions">
              <button id="playButton" type="button">再生</button>
              <button id="pauseButton" type="button">停止</button>
              <button id="syncButton" type="button">位置同期</button>
              <button id="skipButton" type="button">スキップ</button>
            </div>
            <div class="status-actions guest-actions">
              <button id="requestSyncButton" type="button">ホストに同期</button>
            </div>
          </div>

          <div class="members-strip">
            <div id="members" class="members"></div>
            <span id="memberCount">0</span>
          </div>

          <form id="videoForm" class="control-strip">
            <input id="videoUrl" type="url" inputmode="url" placeholder="YouTube URLを追加" autocomplete="off" />
            <button type="submit">追加</button>
          </form>

          <div class="reaction-bar">
            <button class="reaction-btn" type="button" data-emoji="😂">😂</button>
            <button class="reaction-btn" type="button" data-emoji="👍">👍</button>
            <button class="reaction-btn" type="button" data-emoji="❤️">❤️</button>
            <button class="reaction-btn" type="button" data-emoji="🔥">🔥</button>
            <button class="reaction-btn" type="button" data-emoji="👀">👀</button>
          </div>
        </section>

        <section class="tab-panel">
          <div class="tabs" role="tablist">
            <button id="chatTab" class="tab active" type="button" data-tab="chat">チャット</button>
            <button id="playlistTab" class="tab" type="button" data-tab="playlist">プレイリスト <span id="playlistCount">0</span></button>
          </div>

          <div id="chatPane" class="tab-pane active">
            <div class="section-title compact">
              <h2>チャット</h2>
              <span id="videoTitle">未選択</span>
            </div>
            <div id="messages" class="messages"></div>
            <form id="chatForm" class="chat-form">
              <input id="chatInput" maxlength="500" placeholder="メッセージを書く" autocomplete="off" />
              <button type="submit">送信</button>
            </form>
          </div>

          <div id="playlistPane" class="tab-pane">
            <ul id="playlist" class="playlist"></ul>
          </div>
        </section>

        <div class="room-footer">
          <span id="roomLabel" class="room-label"></span>
          <button id="leaveRoom" type="button">退出</button>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="reactionLayer" class="reaction-layer"></div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
