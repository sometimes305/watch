<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Gravity Watch Party</title>
    <script src="https://cdn.gravity.place/fe/sdk/index-1.0.2.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="lobbyScreen" class="screen active">
        <div class="lobby-header">
          <p class="eyebrow">Gravity Watch</p>
          <h1>Watch Party</h1>
          <p>Gravityの友だちとYouTubeを同時視聴</p>
        </div>

        <section class="profile-card">
          <div class="gravity-profile">
            <img id="profileAvatar" alt="" />
            <div>
              <label for="displayName">表示名</label>
              <span id="gravityStatus">Gravity情報を確認中</span>
            </div>
          </div>
          <div class="name-row">
            <input id="displayName" maxlength="24" autocomplete="nickname" />
            <button id="saveName" type="button">保存</button>
          </div>
        </section>

        <section class="lobby-card">
          <h2>ルームを作成</h2>
          <div class="lobby-actions">
            <button id="createPublicRoom" class="primary-action" type="button">公開ルーム作成</button>
            <button id="createPrivateRoom" type="button">プライベート作成</button>
          </div>
        </section>

        <section class="lobby-card">
          <h2>ルームに参加</h2>
          <div class="join-row">
            <input id="joinRoomId" inputmode="numeric" placeholder="ルームID" autocomplete="off" />
            <button id="joinRoomButton" type="button">参加</button>
          </div>
        </section>

        <p class="lobby-note">作成したルームIDをGravityで共有すると、相手はID入力で参加できます。</p>
      </section>

      <section id="roomScreen" class="screen">
        <header class="topbar">
          <div>
            <p class="eyebrow">Room <span id="currentRoomId">----</span></p>
            <h1>Watch Party</h1>
          </div>
          <div class="room-actions">
            <span id="hostBadge" class="host-badge">HOST</span>
            <span id="connectionStatus" class="status-dot">接続中</span>
            <button id="shareRoom" class="icon-button" type="button" title="ルーム招待">↗</button>
          </div>
        </header>

        <section class="stage">
          <div class="video-shell">
            <div id="emptyState" class="empty-state">
              <img id="poster" alt="" src="https://img.youtube.com/vi/jNQXAC9IVRw/maxresdefault.jpg" />
              <div class="empty-copy">
                <span>ルーム準備完了</span>
                <strong>YouTube URLを貼って開始</strong>
              </div>
            </div>
            <div id="player"></div>
          </div>

          <form id="videoForm" class="control-strip">
            <input id="videoUrl" type="url" inputmode="url" placeholder="YouTube URL" autocomplete="off" />
            <button type="submit">読込</button>
          </form>

          <div class="sync-controls">
            <button id="playButton" type="button">再生</button>
            <button id="pauseButton" type="button">停止</button>
            <button id="syncButton" type="button">同期</button>
          </div>
        </section>

        <section class="party-section members-section">
          <div class="section-title">
            <h2>参加者</h2>
            <span id="memberCount">0</span>
          </div>
          <div id="members" class="members"></div>
        </section>

        <section class="party-section chat-section">
          <div class="section-title">
            <h2>チャット</h2>
            <span id="videoTitle">未選択</span>
          </div>
          <div id="messages" class="messages"></div>
          <form id="chatForm" class="chat-form">
            <input id="chatInput" maxlength="500" placeholder="リアクションを書く" autocomplete="off" />
            <button type="submit">送信</button>
          </form>
        </section>

        <div class="room-footer">
          <span id="roomLabel" class="room-label"></span>
          <button id="leaveRoom" type="button">退出</button>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
